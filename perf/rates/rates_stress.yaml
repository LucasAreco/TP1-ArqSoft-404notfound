config:
  environments:
    api:
      target: 'http://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: "artillery-api"

  pool: 3000 # All HTTP requests from all virtual users will be sent over the same connections

  phases:
      - name: QuitStart
        arrivalRate: 0
        duration: 30
      - name: WarmUp
        arrivalRate: 2
        duration: 10
      - name: RampaStress
        duration: 60
        arrivalRate: 1
        rampTo: 1100
      - name: SostenidoStress
        duration: 60
        arrivalRate: 1100


scenarios:
  - name: Rates (/rates)
    flow:
      - get:
          url: '/rates'


