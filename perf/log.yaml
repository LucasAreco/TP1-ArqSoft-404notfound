config:
  environments:
    api:
      target: 'http://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: "artillery-api"

  pool: 50 # All HTTP requests from all virtual users will be sent over the same connections

  phases:
    - name: Ramp
      duration: 120
      arrivalRate: 1
      rampTo: 15
    - name: Plain
      duration: 30
      arrivalRate: 15
    

scenarios:
  - name: Logs (/log)
    flow:
      - get:
          url: '/log'
