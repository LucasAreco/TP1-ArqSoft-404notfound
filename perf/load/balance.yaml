config:
  environments:
    api:
      target: 'http://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: "artillery-api"

  pool: 50 # All HTTP requests from all virtual users will be sent over the same connections

  variables:
    ids_account:
      - 1
      - 2
      - 3
      - 4
    balances:
      - 1000
      - 2000
      - 3000
      - 4000

  phases:
    - name: Warm up
      duration: 15
      arrivalRate: 2
    - name: Ramp up
      duration: 30
      arrivalRate: 5
      rampTo: 30
    - name: Sustained load
      duration: 90
      arrivalRate: 30
    - name: Ramp down
      duration: 15
      arrivalRate: 30
      rampTo: 2

scenarios:
  - name: Balance (/balance)
    flow:
      - put:
          url: '/accounts/{{ ids_account }}/balance'
          json:
            balance: "{{ balances }}"