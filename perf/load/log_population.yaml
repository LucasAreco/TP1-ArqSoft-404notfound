config:
  target: 'http://localhost:5555'
  plugins:
    statsd:
      host: localhost
      port: 8125
      prefix: "artillery-api"

  pool: 1000

  phases:
    - name: Warm up
      duration: 15
      arrivalRate: 5
    - name: Sustained moderate load
      duration: 600
      arrivalRate: 50

scenarios:
  - name: Exchange 1 to 2
    flow:
      - post:
          url: '/exchange'
          json:
            baseCurrency: "USD"
            counterCurrency: "ARS"
            baseAccountId: "1"
            counterAccountId: "2"
            baseAmount: 10

  - name: Exchange 2 to 1
    flow:
      - post:
          url: '/exchange'
          json:
            baseCurrency: "USD"
            counterCurrency: "ARS"
            baseAccountId: "2"
            counterAccountId: "1"
            baseAmount: 10