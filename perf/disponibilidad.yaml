config:
  environments:
    api:
      target: 'http://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: "artillery-api"
  pool: 50
  http:
    timeout: 5
  phases:
    - name: Constante
      duration: 90
      arrivalRate: 10

scenarios:
  - name: Rates (disponibilidad)
    flow:
      - get:
          url: '/rates'
