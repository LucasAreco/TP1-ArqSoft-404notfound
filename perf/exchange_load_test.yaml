config:
  environments:
    api:
      target: 'http://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: "artillery-api"

  pool: 50

  phases:
    - name: Warm up
      duration: 15
      arrivalRate: 2
    - name: Ramp up
      duration: 30
      arrivalRate: 5
      rampTo: 30
    - name: Sustained load
      duration: 90
      arrivalRate: 30
    - name: Ramp down
      duration: 15
      arrivalRate: 30
      rampTo: 2

scenarios:
  - name: Exchange USD -> ARS
    weight: 1
    flow:
      - post:
          url: '/exchange'
          json:
            baseCurrency: "USD"
            counterCurrency: "ARS"
            baseAccountId: "1"
            counterAccountId: "2"
            baseAmount: 10
  - name: Exchange ARS -> USD
    weight: 1
    flow:
      - post:
          url: '/exchange'
          json:
            baseCurrency: "ARS"
            counterCurrency: "USD"
            baseAccountId: "2"
            counterAccountId: "1"
            baseAmount: 15151.51
