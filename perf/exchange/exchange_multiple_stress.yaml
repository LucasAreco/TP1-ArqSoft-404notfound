config:
  environments:
    api:
      target: 'http://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: "artillery-api"

  pool: 3000 # All HTTP requests from all virtual users will be sent over the same connections

  variables:
    pair:
      - {from: "USD", to: "ARS"}
      - {from: "ARS", to: "USD"}
      - {from: "EUR", to: "ARS"}
      - {from: "BRL", to: "ARS"}
      - {from: "ARS", to: "BRL"}
      - {from: "ARS", to: "EUR"}

  phases:
      - name: QuitStart
        pause: 30
      - name: WarmUp
        arrivalRate: 2
        duration: 10
      - name: RampaStress
        duration: 60
        arrivalRate: 1
        rampTo: 900
      - name: SostenidoStress
        duration: 60
        arrivalRate: 900

scenarios:
  - name: Exchange
    flow:
      - post:
          url: '/exchange'
          json:
            baseCurrency: "{{ pair.from }}"
            counterCurrency: "{{ pair.to }}"
            baseAccountId: "1"
            counterAccountId: "2"
            baseAmount: 10