config:
  environments:
    api:
      target: 'http://localhost:5555'
      plugins:
        statsd:
          host: localhost
          port: 8125
          prefix: "artillery-api"

  pool: 3000 # All HTTP requests from all virtual users will be sent over the same connections

  variables:
    pair:
      - {from: "USD", to: "ARS"}
      - {from: "ARS", to: "USD"}
      - {from: "EUR", to: "ARS"}
      - {from: "BRL", to: "ARS"}
      - {from: "ARS", to: "BRL"}
      - {from: "ARS", to: "EUR"}

    rate:
      - 1000
      - 2000
      - 3000
      - 4000

  phases:
    - name: Warm up
      duration: 15
      arrivalRate: 2
    - name: Ramp up
      duration: 30
      arrivalRate: 5
      rampTo: 850
    - name: Sustained load
      duration: 180
      arrivalRate: 850
    - name: Ramp down
      duration: 15
      arrivalRate: 30
      rampTo: 2

scenarios:
  - name: Set Rates (/rates)
    flow:
      - put:
          url: '/rates'
          json:
            baseCurrency: "{{ pair.from }}"
            counterCurrency: "{{ pair.to }}"
            rate: "{{ rate }}"